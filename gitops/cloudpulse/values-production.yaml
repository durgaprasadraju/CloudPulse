# EKS production values — images from ECR (same account as the cluster).
# Apply with:
#   helm upgrade --install cloudpulse ./charts/cloudpulse -n cloudpulse --create-namespace -f gitops/cloudpulse/values-production.yaml

backend:
  enabled: true
  replicaCount: 1
  image:
    repository: 633193633631.dkr.ecr.us-east-1.amazonaws.com/cloudpulse-api-gateway
    tag: "uber-202607191713"
    pullPolicy: Always
  hpa:
    enabled: false
  env:
    HTTP_ADDR: ":8080"
    ENVIRONMENT: production
    RABBITMQ_URI: "amqp://guest:guest@rabbitmq:5672/"
    TRIP_SERVICE_URL: "trip-service:9093"
    DRIVER_SERVICE_URL: "driver-service:9092"
    JAEGER_ENDPOINT: ""
    REDIS_URL: "redis://cloudpulse-production-redis.t8xdwt.ng.0001.use1.cache.amazonaws.com:6379/0"
frontend:
  enabled: true
  replicaCount: 1
  image:
    repository: 633193633631.dkr.ecr.us-east-1.amazonaws.com/cloudpulse-web
    tag: "uber-202607191713"
    pullPolicy: Always
  env:
    NODE_ENV: production
    NEXT_PUBLIC_API_URL: "https://api.cloudpulse.live"
    NEXT_PUBLIC_WEBSOCKET_URL: "wss://api.cloudpulse.live/ws"
ingress:
  enabled: true
  className: alb
  annotations:
    kubernetes.k8s.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:633193633631:certificate/fd9cf0aa-f118-42d2-85ef-0da534230f5c
    alb.ingress.kubernetes.io/success-codes: "200-399"
    # Keep WebSocket connections alive (default 60s idle timeout drops the map's WS)
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=3600
    alb.ingress.kubernetes.io/group.name: cloudpulse
    alb.ingress.kubernetes.io/tags: Environment=production,Project=cloudpulse
  hosts:
    api:
      host: api.cloudpulse.live
      paths:
        - path: /
          pathType: Prefix
    web:
      host: cloudpulse.live
      paths:
        - path: /
          pathType: Prefix
    www:
      enabled: true
      host: www.cloudpulse.live
mongo:
  enabled: true
rabbitmq:
  enabled: true
microservices:
  trip-service:
    enabled: true
    image:
      repository: 633193633631.dkr.ecr.us-east-1.amazonaws.com/cloudpulse-trip-service
      tag: "uber-202607191713"
      pullPolicy: Always
  driver-service:
    enabled: true
    image:
      repository: 633193633631.dkr.ecr.us-east-1.amazonaws.com/cloudpulse-driver-service
      tag: "uber-202607191713"
      pullPolicy: Always
    env:
      ENVIRONMENT: production
      RABBITMQ_URI: "amqp://guest:guest@rabbitmq:5672/"
      REDIS_URL: "redis://cloudpulse-production-redis.t8xdwt.ng.0001.use1.cache.amazonaws.com:6379/0"
      LOCAL_SEED_DRIVERS: "true"
      LOCAL_AUTO_ACCEPT: "true"
      LOCAL_SIMULATE_TRIPS: "true"
      JAEGER_ENDPOINT: ""
  payment-service:
    enabled: true
    image:
      repository: 633193633631.dkr.ecr.us-east-1.amazonaws.com/cloudpulse-payment-service
      tag: "34072bac8d49"
      pullPolicy: Always
namespace:
  create: true
  name: cloudpulse
