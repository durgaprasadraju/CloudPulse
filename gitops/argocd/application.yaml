# ArgoCD Application — GitOps deploy of CloudPulse Helm chart to EKS.
#
# Bootstrap once (after ArgoCD is installed on the cluster):
#   kubectl apply -f gitops/argocd/application-project.yaml
#   kubectl apply -f gitops/argocd/application.yaml
#
# CI updates gitops/cloudpulse/values-production.yaml image tags → ArgoCD auto-syncs.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudpulse
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: cloudpulse
spec:
  project: cloudpulse

  # Single source: chart path + values file relative to the chart directory.
  # (Multi-source $values refs can make helm run without Chart.yaml in some Argo CD setups.)
  source:
    repoURL: https://github.com/durgaprasadraju/CloudPulse.git
    targetRevision: main
    path: charts/cloudpulse
    helm:
      releaseName: cloudpulse
      valueFiles:
        - ../../gitops/cloudpulse/values-production.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: cloudpulse

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  revisionHistoryLimit: 10
