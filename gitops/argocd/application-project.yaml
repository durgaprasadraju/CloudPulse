apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: cloudpulse
  namespace: argocd
spec:
  description: CloudPulse.live production applications
  sourceRepos:
    - https://github.com/durgaprasadraju/CloudPulse.git
  destinations:
    - namespace: cloudpulse
      server: https://kubernetes.default.svc
    - namespace: argocd
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
