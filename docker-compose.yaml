# CloudPulse local prototype stack
#
# Start:  docker compose --env-file .env.example up --build
# (or:    cp .env.example .env && docker compose up --build)
#
# URLs:
#   Rider app:               http://localhost:3000
#   Driver app:              http://localhost:3001
#   API Gateway:             http://localhost:8080
#   RabbitMQ management:     http://localhost:15672  (guest/guest)
#   Jaeger UI:               http://localhost:16686
#
# Note: This ride-sharing codebase uses MongoDB + RabbitMQ today.
# Redis and PostgreSQL are included for the CloudPulse.live prototype
# checklist (tracking / driver data) and are ready for you to wire in.

name: cloudpulse

services:
  # ---------------------------------------------------------------------------
  # Data stores
  # ---------------------------------------------------------------------------
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Real-time driver location tracking (api-gateway + driver-service)
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Persistent driver registry (driver-service)
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cloudpulse}
      POSTGRES_USER: ${POSTGRES_USER:-cloudpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cloudpulse}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cloudpulse} -d ${POSTGRES_DB:-cloudpulse}"]
      interval: 10s
      timeout: 5s
      retries: 5

  jaeger:
    image: jaegertracing/all-in-one:1.57
    restart: unless-stopped
    ports:
      - "16686:16686"
      - "14268:14268"
    environment:
      COLLECTOR_ZIPKIN_HOST_PORT: ":9411"

  # ---------------------------------------------------------------------------
  # Go microservices (built from root multi-stage Dockerfile)
  # ---------------------------------------------------------------------------
  trip-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: trip-service
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017}
      RABBITMQ_URI: ${RABBITMQ_URI:-amqp://guest:guest@rabbitmq:5672/}
      OSRM_API: ${OSRM_API:-https://router.project-osrm.org}
      JAEGER_ENDPOINT: ${JAEGER_ENDPOINT:-http://jaeger:14268/api/traces}
      DRIVER_SERVICE_HTTP_URL: ${DRIVER_SERVICE_HTTP_URL:-http://driver-service:8085}
      JWT_SECRET: ${JWT_SECRET:-cloudpulse-dev-jwt-secret-change-me}
      DATABASE_URL: ${DATABASE_URL:-postgres://cloudpulse:cloudpulse@postgres:5432/cloudpulse?sslmode=disable}
      HTTP_ADDR: ":8086"
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    expose:
      - "9093"
      - "8086"

  driver-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: driver-service
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      RABBITMQ_URI: ${RABBITMQ_URI:-amqp://guest:guest@rabbitmq:5672/}
      JAEGER_ENDPOINT: ${JAEGER_ENDPOINT:-http://jaeger:14268/api/traces}
      DATABASE_URL: ${DATABASE_URL:-postgres://cloudpulse:cloudpulse@postgres:5432/cloudpulse?sslmode=disable}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET: ${JWT_SECRET:-cloudpulse-dev-jwt-secret-change-me}
      AUTH_HTTP_ADDR: ":8085"
      LOCAL_SEED_DRIVERS: ${LOCAL_SEED_DRIVERS:-false}
      LOCAL_AUTO_ACCEPT: ${LOCAL_AUTO_ACCEPT:-false}
      LOCAL_SIMULATE_TRIPS: ${LOCAL_SIMULATE_TRIPS:-false}
      TRIP_OFFER_TIMEOUT_SEC: ${TRIP_OFFER_TIMEOUT_SEC:-30}
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "9092"
      - "8085"

  payment-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: payment-service
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      APP_URL: ${APP_URL:-http://localhost:3000}
      RABBITMQ_URI: ${RABBITMQ_URI:-amqp://guest:guest@rabbitmq:5672/}
      JAEGER_ENDPOINT: ${JAEGER_ENDPOINT:-http://jaeger:14268/api/traces}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-phonepe}
      PHONEPE_MERCHANT_ID: ${PHONEPE_MERCHANT_ID:-}
      PHONEPE_SALT_KEY: ${PHONEPE_SALT_KEY:-}
      PHONEPE_SALT_INDEX: ${PHONEPE_SALT_INDEX:-1}
      PHONEPE_ENV: ${PHONEPE_ENV:-UAT}
      PHONEPE_CALLBACK_URL: ${PHONEPE_CALLBACK_URL:-http://localhost:8080/webhook/phonepe}
      PHONEPE_SUCCESS_URL: ${PHONEPE_SUCCESS_URL:-http://localhost:3000?payment=success}
      PHONEPE_CANCEL_URL: ${PHONEPE_CANCEL_URL:-http://localhost:3000?payment=cancel}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_replace_me}
      STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL:-http://localhost:3000?payment=success}
      STRIPE_CANCEL_URL: ${STRIPE_CANCEL_URL:-http://localhost:3000?payment=cancel}
    depends_on:
      rabbitmq:
        condition: service_healthy

  # HTTP + WebSocket entrypoint — published on host port 8080
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      HTTP_ADDR: ${HTTP_ADDR:-:8080}
      RABBITMQ_URI: ${RABBITMQ_URI:-amqp://guest:guest@rabbitmq:5672/}
      TRIP_SERVICE_URL: ${TRIP_SERVICE_URL:-trip-service:9093}
      DRIVER_SERVICE_URL: ${DRIVER_SERVICE_URL:-driver-service:9092}
      JAEGER_ENDPOINT: ${JAEGER_ENDPOINT:-http://jaeger:14268/api/traces}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      DRIVER_SERVICE_HTTP_URL: ${DRIVER_SERVICE_HTTP_URL:-http://driver-service:8085}
      TRIP_SERVICE_HTTP_URL: ${TRIP_SERVICE_HTTP_URL:-http://trip-service:8086}
      JWT_SECRET: ${JWT_SECRET:-cloudpulse-dev-jwt-secret-change-me}
      STRIPE_WEBHOOK_KEY: ${STRIPE_WEBHOOK_KEY:-}
      PHONEPE_SALT_KEY: ${PHONEPE_SALT_KEY:-}
      PHONEPE_SALT_INDEX: ${PHONEPE_SALT_INDEX:-1}
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      trip-service:
        condition: service_started
      driver-service:
        condition: service_started

  # ---------------------------------------------------------------------------
  # React / Next.js frontends
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
        NEXT_PUBLIC_WEBSOCKET_URL: ${NEXT_PUBLIC_WEBSOCKET_URL:-ws://localhost:8080/ws}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway

  web-driver:
    build:
      context: ./web-driver
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
        NEXT_PUBLIC_WEBSOCKET_URL: ${NEXT_PUBLIC_WEBSOCKET_URL:-ws://localhost:8080/ws}
    restart: unless-stopped
    ports:
      - "3001:3001"
    depends_on:
      - api-gateway

volumes:
  mongo_data:
  redis_data:
  postgres_data:
