## Global
nameOverride: ""
fullnameOverride: ""

## Namespace (created when enabled)
namespace:
  create: true
  name: cloudpulse

## Image pull secrets (ECR / private registry)
imagePullSecrets: []
# - name: ecr-pull-secret

## ---------------------------------------------------------------------------
## Go backend (API Gateway)
## ---------------------------------------------------------------------------
backend:
  enabled: true
  name: backend
  replicaCount: 2

  image:
    repository: cloudpulse/cloudpulse-api-gateway
    tag: "latest"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 80
    targetPort: 8080

  containerPort: 8080

  resources:
    requests:
      cpu: 125m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  env:
    HTTP_ADDR: ":8080"
    ENVIRONMENT: production
    # Override these in values / --set for your cluster
    RABBITMQ_URI: "amqp://guest:guest@rabbitmq:5672/"
    TRIP_SERVICE_URL: "trip-service:9093"
    DRIVER_SERVICE_URL: "driver-service:9092"
    JAEGER_ENDPOINT: "http://jaeger:14268/api/traces"
    # Terraform-provisioned ElastiCache Redis — real-time driver tracking.
    # Set to `terraform output redis_url` (e.g. redis://<primary-endpoint>:6379/0)
    REDIS_URL: ""
    # driver-service also reads DATABASE_URL (Terraform RDS endpoint; credentials
    # live in AWS Secrets Manager — see `terraform output rds_secrets_manager_arn`).
    DATABASE_URL: ""

  # Extra env from existing Secrets / ConfigMaps
  extraEnv: []
  # - name: STRIPE_WEBHOOK_KEY
  #   valueFrom:
  #     secretKeyRef:
  #       name: stripe-secrets
  #       key: stripe-webhook-key

  # TCP probes — API Gateway has no dedicated /health route (HTTP / returns 404)
  livenessProbe:
    tcpSocket:
      port: http
    initialDelaySeconds: 15
    periodSeconds: 20
    failureThreshold: 3

  readinessProbe:
    tcpSocket:
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3

  ## Horizontal Pod Autoscaler (CPU)
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

## ---------------------------------------------------------------------------
## React / Next.js frontend
## ---------------------------------------------------------------------------
frontend:
  enabled: true
  name: frontend
  replicaCount: 2

  image:
    repository: cloudpulse/cloudpulse-web
    tag: "latest"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 80
    targetPort: 3000

  containerPort: 3000

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  env:
    NODE_ENV: production
    # Browser-facing URLs must use public hostnames (baked at build OR runtime if supported)
    NEXT_PUBLIC_API_URL: "https://api.cloudpulse.live"
    NEXT_PUBLIC_WEBSOCKET_URL: "wss://api.cloudpulse.live/ws"

  extraEnv: []

  livenessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 30
    periodSeconds: 20

  readinessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 10
    periodSeconds: 10

## ---------------------------------------------------------------------------
## Ingress — AWS Load Balancer Controller (ALB)
## Hosts:
##   api.cloudpulse.live  → Go backend
##   cloudpulse.live      → React frontend
## ---------------------------------------------------------------------------
ingress:
  enabled: true
  className: alb
  annotations:
    kubernetes.k8s.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    # Replace with your ACM certificate ARN in the target region:
    # alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:REGION:ACCOUNT:certificate/UUID
    alb.ingress.kubernetes.io/healthcheck-path: /
    # Frontend returns 200; backend root may return 404 — accept both as healthy
    alb.ingress.kubernetes.io/success-codes: "200-399"
    alb.ingress.kubernetes.io/group.name: cloudpulse
    alb.ingress.kubernetes.io/tags: Environment=production,Project=cloudpulse

  hosts:
    api:
      host: api.cloudpulse.live
      paths:
        - path: /
          pathType: Prefix
    web:
      host: cloudpulse.live
      paths:
        - path: /
          pathType: Prefix
    # Optional www redirect target (same frontend service)
    www:
      enabled: true
      host: www.cloudpulse.live

## Service account
serviceAccount:
  create: true
  name: ""
  annotations: {}
  # For IRSA, set e.g.:
  # annotations:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT:role/cloudpulse-app

## Pod security / scheduling
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
