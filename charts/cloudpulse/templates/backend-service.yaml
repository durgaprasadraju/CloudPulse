{{- if .Values.backend.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cloudpulse.backend.fullname" . }}
  namespace: {{ include "cloudpulse.namespace" . }}
  labels:
    {{- include "cloudpulse.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  annotations:
    # ALB health check: api-gateway serves 200 on /health (no root route)
    alb.ingress.kubernetes.io/healthcheck-path: /health
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: {{ .Values.backend.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "cloudpulse.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
{{- end }}
